# The CI gate. It runs `just ci` inside the dev shell, the same command as the pre-push hook.
# The repository variables NIX_CACHE_URL and NIX_CACHE_PUBLIC_KEY turn on the binary cache of ADR-0600.
# The nixosTests of ADR-0300 boot VMs, so the runner needs KVM.

name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # A push to the binary cache authenticates with the OIDC token of the job, so no secret is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Enable KVM for the nixosTests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v32.0.0
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = ${{ vars.NIX_CACHE_URL }}
            extra-trusted-public-keys = ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      # The title becomes the squash commit, so it follows Conventional Commits too.
      # It goes through `env`, never into the script text, so a title cannot inject shell.
      - name: Validate the PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        # cog prints the author of the message, so it needs a git identity, and a runner has none.
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          nix develop --command cog --config .config/cog.toml verify "$TITLE"
      - run: nix develop --command just ci
      # A push to master stores what the job built, so the next job downloads it instead of building it.
      - name: Push to the binary cache
        if: github.event_name == 'push' && vars.NIX_CACHE_URL != ''
        env:
          NIX_CACHE_URL: ${{ vars.NIX_CACHE_URL }}
        run: nix develop --command just cache-push
